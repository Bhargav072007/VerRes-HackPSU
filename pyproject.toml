[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "verres-partner-b"
version = "0.1.0"
description = "Partner B evidence engine; provisional interfaces pending Lane A contracts"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<0.29", "pydantic>=2.10,<3", "defusedxml>=0.7,<0.8",
  "pdfplumber>=0.11,<0.12", "bm25s>=0.3,<0.4", "asyncpg>=0.30,<1",
  "aiolimiter>=1.2,<2", "PyYAML>=6,<7", "rapidfuzz>=3,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "respx>=0.22,<0.24", "ruff>=0.14,<1", "reportlab>=4,<6"]

[tool.setuptools.packages.find]
where = ["api"]
include = ["app*"]

[tool.setuptools.package-data]
app = ["providers/*.yaml", "prompts/*.md", "eval/*.jsonl", "verify/*.md"]

[tool.pytest.ini_options]
pythonpath = ["api"]
testpaths = ["api/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
