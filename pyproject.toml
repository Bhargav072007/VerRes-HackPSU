[project]
name = "verres"
version = "0.1.0"
description = "Pre-submission research integrity review: receipts, not scores."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.135.1",
  "pydantic==2.11.4",
  "pydantic-settings==2.9.1",
  "httpx==0.28.1",
  "asyncpg==0.30.0",
  "bm25s==0.2.13",
  "uvicorn==0.34.2",
  "pypdf==6.21.2",
  "python-multipart==0.0.22",
  "defusedxml==0.7.1",
  "pdfplumber==0.11.10",
  "pypdfium2==5.14.0",
  "aiolimiter==1.3.0",
  "PyYAML==6.0.3",
  "rapidfuzz==3.14.6",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "pytest-asyncio==0.26.0",
  "respx==0.22.0",
  "ruff==0.11.9",
  "reportlab==5.1.0",
]

[build-system]
requires = ["setuptools==80.3.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*", "contracts*"]

[tool.setuptools.package-data]
"api.app" = ["providers/*.yaml", "prompts/*.md", "review/prompts/*.md", "eval/*.jsonl", "verify/*.md"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests", "api/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
