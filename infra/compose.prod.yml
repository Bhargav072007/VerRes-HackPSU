name: verres-prod
services:
  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      ENV: production
      DATABASE_URL: postgresql://verres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/verres
      GROBID_URL: http://grobid:8070
      DATA_DIR: /data
      GIT_SHA: ${GIT_SHA:-dev}
      DEMO_FIXTURE: ${DEMO_FIXTURE:-0}
      # Only Caddy may supply client addresses; never trust the whole network.
      FORWARDED_ALLOW_IPS: 172.30.0.2
    networks:
      default:
      proxy:
    volumes:
      - api_data:/data
      - ../fixtures/demo:/app/fixtures/demo:ro
    depends_on:
      db:
        condition: service_healthy
      grobid:
        condition: service_started
  grobid:
    image: grobid/grobid:0.9.1-crf
    restart: unless-stopped
    mem_limit: 4g
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: verres
      POSTGRES_DB: verres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verres -d verres"]
      interval: 5s
      timeout: 3s
      retries: 10
  caddy:
    image: caddy:2
    restart: unless-stopped
    networks:
      proxy:
        ipv4_address: 172.30.0.2
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
networks:
  proxy:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          ip_range: 172.30.0.128/25
volumes:
  api_data:
  postgres_data:
  caddy_data:
  caddy_config:
