services:
  grobid:
    image: grobid/grobid:0.9.1-crf
    mem_limit: 4g
    ports:
      - "127.0.0.1:8070:8070"
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: verres
      POSTGRES_DB: verres
      # Local development only; port is restricted to loopback.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verres -d verres"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
